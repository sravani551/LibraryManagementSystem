spring.application.name=library-management
server.port=8080

# In-memory H2 by default; override with DB_URL / DB_USER / DB_PASSWORD for a real database
spring.datasource.url=${DB_URL:jdbc:h2:mem:librarydb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console for local development only
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# Comma-separated list of origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Set LOG_SQL=DEBUG to see generated SQL
logging.level.org.hibernate.SQL=${LOG_SQL:INFO}
